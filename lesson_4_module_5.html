<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My magic word lab</title>
    <link rel="stylesheet"
href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
    body {background: lightyellow;}
    h1, h3 {color: darkorange;}
    .box {background: white;color: darkorange;}
</style>
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-1">My Magic Word Lab</h1>
        <p class="text-muted mb-4">Discover types, switch them, find & swap words, ad catch sneaky error!</p>
        <!--Topic 1 -- Typeof -->
        <div class="card mb-4"><div class="card-body">
            <h3 class="card title">What type is this?</h3>
            <button class="btn btn-warning" onclick="checkTypes()">Reveal the Type😃</button>
            <div id="typeResult" class="box p-3 mt-3 rounded">Press the button to reveal the secret types!</div>
        </div></div>
        <!--Topic 2 - String() & number()-->
        <div class="mb-4"><div class="card-body">
            <h3 class="card-title">Switch the numbers and strings</h3>
            <input id="numIn" class="form-control"></input>
        </div></div>
    </div>
</body>
</html>
